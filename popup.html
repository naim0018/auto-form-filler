<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Auto Form Filler</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="mark" aria-hidden="true">A<span>✓</span></span><div><h1>Auto Form Filler</h1><p>Good test data. One click.</p></div></header>
  <main>
    <label class="country" for="country">Test data country</label>
    <select id="country"><option value="US">United States</option><option value="BD">Bangladesh</option><option value="GB">United Kingdom</option><option value="IN">India</option><option value="PK">Pakistan</option><option value="CA">Canada</option><option value="AU">Australia</option><option value="DE">Germany</option><option value="FR">France</option><option value="JP">Japan</option><option value="SG">Singapore</option><option value="AE">United Arab Emirates</option></select>
    <p>Fresh values and random choices on every fill.</p>
    <button id="fill" disabled>Fill this page <span aria-hidden="true">↗</span></button>
    <p id="status" role="status" aria-live="polite">Loading settings…</p>
  </main>
  <footer>Offline test data · Forms are never auto-submitted<br><span>Shortcut: Alt + Shift + F</span></footer>
  <script src="runner.js"></script><script src="popup.js"></script>
</body>
</html>
